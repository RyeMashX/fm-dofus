<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM Dofus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>FM Dofus</h1>
  <span id="status" class="muted small"></span>
  <div class="spacer"></div>
  <button id="pip" class="secondary small hidden" title="Ouvrir dans une fenêtre qui reste au-dessus des autres (Chrome, Edge)">Flottant</button>
  <div id="view-switch" class="seg hidden">
    <button data-view="item">Objet</button>
    <button data-view="fm">FM</button>
  </div>
</header>

<div id="reliquat-bar" class="reliquat hidden">
  <span class="lbl">Reliquat</span>
  <button id="rel-minus" class="step">−1</button>
  <input id="reliquat" type="number" step="1" min="0" class="num" inputmode="decimal">
  <button id="rel-plus" class="step">+1</button>
  <div class="spacer"></div>
  <span id="item-chip" class="chip"></span>
</div>

<main>
  <section id="search" class="card">
    <h2>Objet</h2>
    <input id="search-input" type="search" placeholder="Nom de l'objet (DofusDB)…" autocomplete="off">
    <ul id="search-results" class="results"></ul>
    <p class="muted small">Ou <button class="link" id="manual-item">créer un objet à la main</button>.</p>
  </section>

  <!-- Vue Objet -->
  <section id="item" class="card view-item hidden">
    <div class="item-head">
      <img id="item-icon" alt="">
      <div class="grow">
        <h2 id="item-name"></h2>
        <div class="muted small"><span id="item-meta"></span> · niveau <span id="item-level-text"></span>
          <button class="link small" id="item-level-edit">modifier</button>
          <input id="item-level" type="number" class="num small hidden" min="1" max="200"></div>
      </div>
      <button id="change-item" class="secondary small">Changer</button>
    </div>
    <div class="legend small muted"><span><b class="cur-dot"></b> actuel</span><span><b class="tgt-dot"></b> cible</span><span><i class="sw sc"></i>SC <i class="sw sn"></i>SN <i class="sw ec"></i>EC</span><span><i class="recsw"></i> rune conseillée</span></div>
    <div id="lines"></div>
    <div class="row">
      <select id="exo-select"><option value="">+ Ajouter un exo…</option></select>
    </div>
  </section>

  <!-- Vue FM -->
  <section id="advice" class="card view-fm hidden">
    <div class="row">
      <h2>Prochain coup</h2>
      <div class="spacer"></div>
      <select id="top-select" class="small"><option value="1">meilleur</option><option value="3">top 3</option></select>
      <select id="samples-select" class="small"><option value="500">rapide</option><option value="1500" selected>normal</option><option value="5000">fin</option></select>
      <button id="advise" class="primary">Calculer</button>
    </div>
    <div id="advice-out"></div>
  </section>

  <section id="pose" class="card view-fm hidden">
    <div class="row">
      <div id="pose-rune" class="grow"></div>
      <button class="link small" id="other-rune">autre rune</button>
    </div>
    <div id="rune-picker" class="row hidden">
      <select id="rune-stat"></select>
      <div id="rune-tiers" class="tiers"></div>
    </div>
    <div class="outcomes">
      <button class="sc" data-outcome="SC">SC</button>
      <button class="sn" data-outcome="SN">SN</button>
      <button class="ec" data-outcome="EC">EC</button>
      <button id="simulate" class="secondary small" title="Tire le résultat et les pertes avec le moteur (test sans le jeu)">Simuler</button>
    </div>
    <div id="loss-panel" class="hidden"></div>
  </section>

  <section id="history" class="card view-fm hidden">
    <div class="row"><h2>Historique</h2><span id="history-stats" class="muted small"></span><div class="spacer"></div>
      <button id="undo" class="secondary small">Annuler</button>
      <button id="reset" class="secondary small">Recommencer</button>
    </div>
    <ol id="history-list"></ol>
    <div class="row small"><span id="journal-stats" class="muted"></span><div class="spacer"></div>
      <button id="journal-export" class="secondary small" title="Télécharge le journal (JSON) pour analyse">Exporter le journal</button>
      <button id="journal-clear" class="link small">vider</button></div>
  </section>
</main>

<footer class="muted small">
  Modèle reconstruit à partir du simulateur DoFocus ; objets DofusDB. Formule officielle non publiée : les chances sont une estimation.
</footer>

<script type="module" src="src/ui.js"></script>
</body>
</html>
