name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      # Cache-busting : GitHub Pages garde CSS/JS 10 min en cache, on suffixe les URLs avec le commit
      - run: |
          V=${GITHUB_SHA::8}
          sed -i "s#style\.css#style.css?v=$V#; s#src/ui\.js#src/ui.js?v=$V#; s#name=\"fm-version\" content=\"dev\"#name=\"fm-version\" content=\"$V\"#" index.html
          sed -i -E "s#from '(\./[a-z]+\.js)'#from '\1?v=$V'#g; s#'\./worker\.js'#'./worker.js?v=$V'#" src/*.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
